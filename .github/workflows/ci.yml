name: CI
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Lua (addon contract test)
        run: sudo apt-get install -y -qq lua5.1 > /dev/null
      - name: Install
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        if: success() || failure()
        run: npm test
      - name: Build
        if: success() || failure()
        run: npm run build
      - name: Renderer bundle for preview
        if: success()
        run: echo "RENDERER_B64_BEGIN $(tar -czf - -C out/renderer . | base64 -w0) RENDERER_B64_END"
      - name: Upload renderer preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-preview
          path: app/out/renderer
          retention-days: 7
      - name: Check addon
        run: npm run --if-present check:addon
      - name: Product name check
        working-directory: .
        run: "! git grep -il 'fyke[e]' -- app addon data .github ':!app/src/main/dataStore.ts'"
