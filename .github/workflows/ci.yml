name: CI
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        if: success() || failure()
        run: npm test
      - name: Build
        if: success() || failure()
        run: npm run build
      - name: Renderer bundle for preview
        if: success()
        run: echo "RENDERER_B64_BEGIN $(tar -czf - -C out/renderer . | base64 -w0) RENDERER_B64_END"
      - name: Check addon
        run: npm run --if-present check:addon
      - name: Product name check
        working-directory: .
        run: "! git grep -il 'fyke[e]' -- app addon data .github"
