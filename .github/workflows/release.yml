name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build Windows app
        run: npm run dist:win
      - name: Zip addon
        working-directory: .
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { 'dev' }
          Compress-Archive -Path addon/AzerothTracker -DestinationPath "app/dist/AzerothTracker-addon-$name.zip"
      - name: List build output
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, Length
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/dist/AzerothTracker-*.exe
            app/dist/AzerothTracker-addon-*.zip
