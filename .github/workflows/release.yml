name: Release
on:
  push:
    tags: ['v*']
    branches: ['feat/**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.1.0-preview.1 (empty = build only)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund || npm install --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Test
        run: npm test
      - name: Build Windows app
        run: npm run dist:win
      - name: Zip addon
        working-directory: .
        shell: pwsh
        run: |
          $name = if ('${{ inputs.tag }}' -ne '') { '${{ inputs.tag }}' } elseif ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { 'dev' }
          Compress-Archive -Path addon/AzerothTracker -DestinationPath "app/dist/AzerothTracker-addon-$name.zip"
      - name: Checksums and release notes
        shell: bash
        run: node scripts/release-notes.mjs dist dist/AzerothTracker-*-win-x64.zip dist/AzerothTracker-addon-*.zip
      - name: List build output
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, Length
      - name: Upload Windows preview build
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: |
            app/dist/AzerothTracker-*-win-x64.zip
            app/dist/AzerothTracker-addon-*.zip
            app/dist/SHA256SUMS.txt
          retention-days: 14
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          body_path: app/dist/release-notes.md
          files: |
            app/dist/AzerothTracker-*-win-x64.zip
            app/dist/AzerothTracker-addon-*.zip
            app/dist/SHA256SUMS.txt
